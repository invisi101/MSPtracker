# Optional: run MSP Tracker in Docker instead of directly with Node. Data lives in ./data.
services:
  msptracker:
    build: .
    image: msptracker
    container_name: msptracker
    restart: unless-stopped
    ports:
      - "127.0.0.1:7797:3000"
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
